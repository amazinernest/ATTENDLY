<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Squircle with Dark Obsidian background & Subtle Lime Ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0c0d14" stroke="#d7f837" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Graduation Cap Icon in Vibrant Electric Lime (#d7f837) -->
  <g transform="translate(14, 14) scale(1.5)" stroke="#d7f837" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Diamond Mortarboard Top -->
    <polygon points="12 2 22 7 12 12 2 7" fill="#d7f837" fill-opacity="0.2" />
    <path d="M22 7l-10 5L2 7l10-5 10 5z" />
    
    <!-- Cap Underneath Skull Cap -->
    <path d="M6 10v4.5C6 17.5 8.7 20 12 20s6-2.5 6-5.5V10" />
    
    <!-- Tassel hanging from right edge -->
    <path d="M20 8v7" stroke="#ffffff" />
    <circle cx="20" cy="16" r="1.2" fill="#d7f837" stroke="none" />
  </g>
</svg>